<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sandglass: backlit sand animation that morphs between images." />
    <title>Sandglass</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffd59a'/%3E%3Cpath d='M9 6h14v2l-5.5 8L23 24v2H9v-2l5.5-8L9 8z' fill='%23301c0c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage"><canvas id="lightbox"></canvas></div>

    <div id="status" class="ui" hidden><span class="spinner"></span><span class="text"></span></div>
    <div id="rec" hidden>REC 0:00</div>
    <div id="toast"></div>
    <div id="strip" class="ui"></div>
    <div id="webcam" class="ui" hidden><span>S to snap</span></div>
    <div id="help" class="ui">
      drag on the glass to push sand · <b>Space</b> play/pause · <b>←/→</b> scenes · <b>S</b> webcam snapshot ·
      <b>R</b> record · <b>C</b> clean mode · <b>F</b> fullscreen · <b>H</b> hide UI
    </div>
    <div id="dropzone" hidden><div>Drop images to add scenes</div></div>
    <div id="fatal" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
